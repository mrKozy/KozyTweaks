name: app

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Branding-Check: die Referenzmarke darf nirgends im Repo auftauchen (Kapitel 2.2).
      - name: Branding-Check
        shell: pwsh
        run: |
          $hits = Get-ChildItem -Recurse -File |
            Where-Object { $_.FullName -notmatch '\\(\.git|node_modules|bin|obj|\.github)\\' -and $_.Name -ne 'kozy-coding-plan.md' } |
            Select-String -Pattern 'risxn|rixzsen'
          if ($hits) { $hits; exit 1 }

      - name: Restore
        run: dotnet restore kozy.sln

      - name: Build
        run: dotnet build kozy.sln --no-restore -c Release

      - name: Test
        run: dotnet test kozy.sln --no-build -c Release --logger "trx;LogFileName=test-results.trx"